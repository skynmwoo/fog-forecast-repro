# Canonical configuration for the fog forecasting reproduction study.
# Every number used in the manuscript must be traceable back to this file
# plus the result CSVs generated by scripts/.

paths:
  raw_data_dir: data/raw          # KMA ASOS per-station, per-year CSV files
  processed_dir: data/processed
  results_dir: results
  checkpoints_dir: checkpoints

data:
  # Fog definition: ASOS visibility is reported in units of 10 m.
  # 100 (= 1000 m = 1 km) or below is labelled fog.
  fog_threshold_vis10m: 100
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  # Temporal split (strictly chronological, no shuffling)
  train_end: "2022-01-01"   # train  : t <  2022-01-01   (2015-2021)
  val_end: "2023-01-01"     # val    : 2022-01-01 <= t < 2023-01-01 (2022)
                            # test   : t >= 2023-01-01   (2023-2024)

  # File naming convention in raw_data_dir.
  # Taebaek files have no station prefix (2015.csv ... 2024.csv).
  stations:
    Taebaek:        {ko: "태백",   prefix: ""}
    Daegwallyeong:  {ko: "대관령", prefix: "대관령_"}
    Baengnyeongdo:  {ko: "백령도", prefix: "백령도_"}
    Incheon:        {ko: "인천",   prefix: "인천_"}
    Ganghwa:        {ko: "강화",   prefix: "강화_"}
    Dongducheon:    {ko: "동두천", prefix: "동두천_"}
    Paju:           {ko: "파주",   prefix: "파주_"}
    Cheorwon:       {ko: "철원",   prefix: "철원_"}
    Chuncheon:      {ko: "춘천",   prefix: "춘천_"}
    Inje:           {ko: "인제",   prefix: "인제_"}
    Sokcho:         {ko: "속초",   prefix: "속초_"}
    Seoul:          {ko: "서울",   prefix: "서울_"}

  # Physical plausibility filter applied to raw observations.
  valid_ranges:
    "기온(°C)":       [-40, 50]
    "이슬점온도(°C)": [-60, 50]
    "습도(%)":        [0, 100]
    "풍속(m/s)":      [0, 30]
    "현지기압(hPa)":  [850, 1100]
    "지면온도(°C)":   [-60, 70]
    "시정(10m)":      [0, 5000]

features:
  # ---------------------------------------------------------------
  # Tabular feature set used by XGBoost (28 features).
  # All are observable at or before time t; target is fog at t+1.
  # ---------------------------------------------------------------
  xgb:
    - "시정(10m)"            # current visibility at t  (INCLUDED - see AUDIT #F1)
    - "기온(°C)"
    - "이슬점온도(°C)"
    - "습도(%)"
    - "풍속(m/s)"
    - "현지기압(hPa)"
    - "지면온도(°C)"
    - "dew_point_depression"
    - "hour"
    - "air_ground_diff"
    - "dpd_ratio"
    - "ground_air_diff"
    - "ground_air_diff_1h"
    - "rel_humid"
    - "weekday"
    - "is_weekend"
    - "month_sin"
    - "month_cos"
    - "temp_lag_1"
    - "temp_lag_2"
    - "temp_lag_3"
    - "humidity_lag_1"
    - "humidity_lag_2"
    - "humidity_lag_3"
    - "vis_lag_1"
    - "vis_lag_2"
    - "vis_lag_3"
    - "temp_roll_mean_2h"
    - "humid_roll_std_2h"

  # ---------------------------------------------------------------
  # Sequential feature set used by 1D-CNN and LSTM (14 variables),
  # exactly as described in the manuscript Methods.
  # ---------------------------------------------------------------
  dl:
    - "기온(°C)"
    - "이슬점온도(°C)"
    - "습도(%)"
    - "풍속(m/s)"
    - "현지기압(hPa)"
    - "지면온도(°C)"
    - "시정(10m)"
    - "dew_point_depression"
    - "ground_air_diff"
    - "vis_lag_1"
    - "humidity_lag_1"
    - "hour"
    - "month_sin"
    - "month_cos"

models:
  xgboost:
    n_estimators: 250
    max_depth: 5
    learning_rate: 0.03
    subsample: 0.6
    colsample_bytree: 0.6
    objective: "binary:logistic"
    eval_metric: "logloss"
    # scale_pos_weight = n_negative / n_positive, computed per station & task
    tree_method: "hist"

  deep:
    seq_len: 6          # window covers t-5 ... t  (INCLUSIVE of t) -> predicts t+1
    batch_size: 512
    max_epochs: 15
    learning_rate: 0.001
    optimizer: "adam"
    early_stopping_patience: 3   # on validation F1 (higher is better)
    dropout: 0.3
    cnn:
      channels: [32, 64]
      kernel_size: 3
      padding: "same"
      pooling: "global_average"
      fc: [64, 32]
    lstm:
      hidden_size: 64
      num_layers: 1
      fc: [64, 32]

evaluation:
  # Threshold grid searched on the VALIDATION set only, then frozen for test.
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_steps: 181

reproducibility:
  seed: 42
  # Additional seeds used only for the stability diagnostic (not for reporting).
  stability_seeds: [42, 1337, 2024]
  deterministic: true
